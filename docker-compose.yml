services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=agentic
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "10302:5432"

  lab-target:
    build:
      context: ./lab-target
    ports:
      - "10303:10303"
    environment:
      - PORT=10303

  frontend:
    build:
      context: ./frontend
    ports:
      - "10300:10300"
    environment:
      - PORT=10300
      - BACKEND_URL=http://backend:10301
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "10301:10301"
    environment:
      - PORT=10301
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/agentic
    depends_on:
      - db
      - lab-target
